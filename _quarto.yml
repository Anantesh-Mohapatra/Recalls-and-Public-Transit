format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true         # Code blocks collapsible by default
    code-tools: true        # Show/hide all code button
    embed-resources: true   # Self-contained HTML, no external dependencies
    fig-width: 9
    fig-height: 5.5

execute:
  warning: false            # Suppress package load warnings in rendered output
  message: false            # Suppress info messages (e.g., tidyverse load messages)
  cache: true               # Cache chunk results to speed up re-rendering
